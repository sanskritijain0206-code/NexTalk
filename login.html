<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NexTalk</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f8fbff, #eaf4ff);
            padding: 20px;
        }

        .login-container {
            display: flex;
            width: 950px;
            max-width: 100%;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        /* LEFT PANEL */
        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #0a2540, #0077ff);
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-left h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .login-left p {
            color: #dbe8ff;
            font-size: 1rem;
            line-height: 1.7;
        }

        /* RIGHT PANEL */
        .login-right {
            flex: 1;
            padding: 50px;
        }

        .login-right h2 {
            color: #0a2540;
            margin-bottom: 10px;
        }

        .login-right p {
            color: #666;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #0077ff;
            box-shadow: 0 0 0 3px rgba(0,119,255,0.1);
        }

        .options {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 25px;
            color: #555;
        }

        .options a {
            text-decoration: none;
            color: #0077ff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, #0077ff, #00c6ff);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .signup-link a {
            text-decoration: none;
            color: #0077ff;
            font-weight: 600;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #666;
        }

        @media(max-width: 900px) {
            .login-container {
                flex-direction: column;
            }

            .login-left,
            .login-right {
                padding: 35px;
            }
        }
    </style>
</head>
<body>

<div class="login-container">

    <!-- LEFT -->
    <div class="login-left">
        <h1>Welcome Back</h1>
        <p>
            Log in to continue collaborating with your team, join meetings,
            manage projects and communicate seamlessly with NexTalk.
        </p>
    </div>

    <!-- RIGHT -->
    <div class="login-right">
        <h2>Login to NexTalk</h2>
        <p>Access your team workspace securely.</p>

        <form>
            <div class="input-box">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>
            </div>

            <div class="options">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="signup-link">
            Don’t have an account? <a href="signup.html">Create one</a>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

</div>

</body>
</html>
