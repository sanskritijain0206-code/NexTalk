<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | NexTalk</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f8fbff, #eaf4ff);
            padding: 20px;
        }

        .signup-container {
            display: flex;
            width: 1000px;
            max-width: 100%;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        /* LEFT PANEL */
        .signup-left {
            flex: 1;
            background: linear-gradient(135deg, #0a2540, #0077ff);
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .signup-left h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .signup-left p {
            color: #dbe8ff;
            line-height: 1.7;
        }

        /* RIGHT PANEL */
        .signup-right {
            flex: 1;
            padding: 50px;
        }

        .signup-right h2 {
            color: #0a2540;
            margin-bottom: 10px;
        }

        .signup-right p {
            color: #666;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #0077ff;
            box-shadow: 0 0 0 3px rgba(0,119,255,0.1);
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(135deg, #0077ff, #00c6ff);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .login-link a {
            text-decoration: none;
            color: #0077ff;
            font-weight: 600;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #666;
        }

        @media(max-width: 900px) {
            .signup-container {
                flex-direction: column;
            }

            .signup-left,
            .signup-right {
                padding: 35px;
            }
        }
    </style>
</head>
<body>

<div class="signup-container">

    <!-- LEFT -->
    <div class="signup-left">
        <h1>Join NexTalk</h1>
        <p>
            Create your account and unlock a smarter way to collaborate,
            communicate, manage projects, and work together as a team.
        </p>
    </div>

    <!-- RIGHT -->
    <div class="signup-right">
        <h2>Create Your Account</h2>
        <p>Start collaborating with your team today.</p>

        <form>
            <div class="input-box">
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>

            <div class="input-box">
                <label>Email Address</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Create password" required>
            </div>

            <div class="input-box">
                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="signup-btn">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login</a>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

</div>

</body>
</html>
